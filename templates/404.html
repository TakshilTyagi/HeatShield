{% extends "base.html" %}

{% block title %}Page Not Found (404) - HeatShield{% endblock %}

{% block content %}
<div style="max-width: 520px; margin: 3rem auto; text-align: center;">
  <div class="card" style="padding: 2.5rem 1.5rem;">
    <h1 style="font-size: 3rem; color: var(--accent); margin-bottom: 0.5rem;">404</h1>
    <h2>Page Not Found</h2>
    <p style="color: var(--text-muted); margin-bottom: 1.5rem;">
      The requested route or municipal directory page could not be located.
    </p>
    <a href="{{ url_for('auth.home') }}" class="btn btn-primary">Return to Homepage</a>
  </div>
</div>
{% endblock %}
