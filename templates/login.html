{% extends "base.html" %}

{% block title %}Login - HeatShield{% endblock %}

{% block content %}
<div style="max-width: 440px; margin: 2rem auto;">
  <div class="card">
    <div class="card-header">
      <h2>Sign In</h2>
    </div>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" class="form-control" required placeholder="e.g. admin, vol_amit, res_ram" autofocus>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" required placeholder="Enter your password">
      </div>

      <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 0.5rem;">Sign In</button>
    </form>

    <div style="margin-top: 1.5rem; padding-top: 1rem; border-top: 1px solid var(--border-color); font-size: 0.88rem; color: var(--text-muted);">
      <p style="margin-bottom: 0.4rem;"><strong>One-Click Demo Roles:</strong></p>
      <div style="display: flex; gap: 0.4rem; flex-wrap: wrap; margin-bottom: 0.5rem;">
        <button type="button" class="btn-toggle" style="background:#EBF5FB; color:#1D4ED8;" onclick="fillForm('superadmin', 'admin123')">Super Admin</button>
        <button type="button" class="btn-toggle" onclick="fillForm('admin', 'admin123')">Bareilly Admin</button>
        <button type="button" class="btn-toggle" onclick="fillForm('admin_jaipur', 'admin123')">Jaipur Admin</button>
      </div>
      <div style="display: flex; gap: 0.4rem; flex-wrap: wrap;">
        <button type="button" class="btn-toggle" onclick="fillForm('vol_amit', 'vol123')">Volunteer (Amit)</button>
        <button type="button" class="btn-toggle" onclick="fillForm('vol_vikram', 'vol123')">Volunteer (Vikram)</button>
        <button type="button" class="btn-toggle" onclick="fillForm('res_ram', 'res123')">Resident (High-Risk)</button>
        <button type="button" class="btn-toggle" onclick="fillForm('res_shanti', 'res123')">Resident (Checked)</button>
      </div>
    </div>
  </div>

  <p style="text-align: center; font-size: 0.9rem;">
    New resident or volunteer? <a href="{{ url_for('auth.register') }}">Register here</a>
  </p>
</div>

<script>
function fillForm(u, p) {
  document.getElementById('username').value = u;
  document.getElementById('password').value = p;
}
</script>
{% endblock %}
